<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>☘ Café Pipeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;--border:#30363d;
  --amber:#F0A500;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#d2a8ff;
  --text:#e6edf3;--muted:#8b949e;--radius:8px
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;overflow-x:hidden}
/* Tab bar */
.tabs{display:flex;position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:13px 4px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
/* Layout */
.page{padding:14px;max-width:560px;margin:0 auto;padding-bottom:80px}
.ttl{font-size:17px;font-weight:700;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card-name{font-weight:700;font-size:14px;margin-bottom:2px}
.card-meta{color:var(--muted);font-size:12px;margin-bottom:8px}
/* Inputs */
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;padding:9px 11px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:monospace}
.field input:focus{outline:none;border-color:var(--amber)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;white-space:nowrap;text-decoration:none}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-a{background:var(--amber);color:#000}
.btn-g{background:var(--green);color:#000}
.btn-r{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-block{width:100%;justify-content:center;padding:11px}
.btn-sm{padding:6px 11px;font-size:11px}
/* Status badges */
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.s-new{background:#21262d;color:var(--muted)}
.s-building{background:#1f3a5f;color:var(--blue)}
.s-live{background:#2f2a1a;color:var(--amber)}
.s-sent{background:#2a1f3a;color:var(--purple)}
.s-hot{background:#3a1a1a;color:#ff9090}
.s-full{background:#0d2e1a;color:var(--green)}
.s-paid{background:#0a4020;color:#5eff8a}
.s-no{background:#2d1116;color:var(--red)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center}
.stat-n{font-size:20px;font-weight:700;color:var(--amber)}
.stat-l{font-size:10px;color:var(--muted);margin-top:1px}
/* Log */
.log{background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;font-family:monospace;max-height:180px;overflow-y:auto;margin-top:10px}
.li{margin-bottom:3px;color:var(--muted)}
.li.ok{color:var(--green)}
.li.err{color:var(--red)}
.li.hi{color:var(--blue)}
/* Textarea */
.pitch-area{width:100%;background:#0a0d12;border:1px solid var(--border);border-radius:6px;padding:9px;font-size:12px;color:var(--text);resize:vertical;min-height:110px;margin:7px 0 6px;font-family:-apple-system,sans-serif;line-height:1.5}
/* Alerts */
.alert{padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:10px;line-height:1.5}
.alert-w{background:#2f2a1a;border:1px solid #5a4f20;color:#d4a017}
.alert-ok{background:#0d2e1a;border:1px solid #1a5c32;color:var(--green)}
.alert-b{background:#1a2535;border:1px solid #1f4060;color:var(--blue)}
/* Spinner */
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Divider */
hr{border:none;border-top:1px solid var(--border);margin:12px 0}
/* Empty */
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-i{font-size:36px;margin-bottom:8px}
/* Actions row */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* Link */
.lnk{color:var(--blue);font-size:11px;word-break:break-all}
.lnk-g{color:var(--green)}
/* Group label */
.grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px}
/* Progress bar */
.prog{height:3px;background:var(--border);border-radius:2px;margin:6px 0;overflow:hidden}
.prog-f{height:100%;background:var(--amber);transition:width .4s}
/* Section heading */
.sec-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
/* Revise form */
.revise-box{margin-top:10px;padding:10px;background:#0a0d12;border:1px solid var(--border);border-radius:6px}
.revise-box textarea{width:100%;background:#161b22;border:1px solid var(--border);border-radius:5px;padding:9px;font-size:12px;color:var(--text);resize:vertical;min-height:80px;font-family:-apple-system,sans-serif;line-height:1.5;margin-bottom:8px}
.revise-box textarea:focus{outline:none;border-color:var(--amber)}
.rev-hint{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.rev-count{display:inline-block;padding:1px 6px;background:rgba(63,185,113,.15);color:var(--green);border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.05em;margin-left:4px}
</style>
</head>

<script>

const WM = (waLink) => `

// ══════════════════════════════
//  STATE
// ══════════════════════════════
const S = {
  gKey: '', aKey: '',
  ghToken: '', ghUser: '',  // GitHub Pages deploy
  wiseLink: '', usdtAddr: '',
  region: 'samui',
  tab: 'setup',
  leads: [],
  log: [],
  busy: null,
  revisingId: null,
};

// ══════════════════════════════
//  PERSISTENCE (localStorage)
//  Note: not used in Claude artifacts;
//  (localStorage works when hosted anywhere — Netlify, GitHub Pages, etc.)
// ══════════════════════════════
const STORAGE_KEY = 'cafe-pipeline-v1';

function saveState() {
  // Strategy: keep demoHtml only for leads where deploy hasn't succeeded yet
  // (so retries skip Claude). For successful deploys, HTML can be re-fetched
  // from the live URL if needed.
  const slim = S.leads.map(l => {
    const keepDemoHtml = !l.demoUrl;  // deploy failed → keep HTML for retry
    return {
      ...l,
      demoHtml: keepDemoHtml ? l.demoHtml : (l.demoHtml ? '__saved__' : null),
      fullHtml: l.fullHtml ? '__saved__' : null,
    };
  });
  const payload = {
    gKey: S.gKey, aKey: S.aKey,
      ghToken: S.ghToken, ghUser: S.ghUser,
    wiseLink: S.wiseLink, usdtAddr: S.usdtAddr,
    region: S.region, leads: slim
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch(e) {
    // Quota exceeded — fall back to stripping everything
    try {
      payload.leads = S.leads.map(l => ({
        ...l, demoHtml: l.demoHtml ? '__saved__' : null, fullHtml: l.fullHtml ? '__saved__' : null
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch(e2) {/* hopeless */}
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S.gKey     = d.gKey     || '';
    S.aKey     = d.aKey     || '';
    S.ghToken = d.ghToken || '';
    S.ghUser  = d.ghUser  || '';
    S.wiseLink = d.wiseLink || '';
    S.usdtAddr = d.usdtAddr || '';
    S.region   = d.region   || 'samui';
    S.leads    = d.leads    || [];
  } catch(e) {}
}

function resetAll() {
  if (!confirm('Wipe ALL data — keys, leads, everything? This cannot be undone.')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  S.gKey = ''; S.aKey = ''; S.ghToken = ''; S.ghUser = ''; S.wiseLink = ''; S.usdtAddr = '';
  S.region = 'samui'; S.leads = []; S.log = []; S.busy = null;
  go('setup');
}

// ══════════════════════════════
//  LOGGING
// ══════════════════════════════
function lg(msg, type='hi') {
  S.log.unshift({msg, type, t: new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
  if (S.log.length > 120) S.log.pop();
  const el = document.getElementById('log');
  if (el) el.innerHTML = S.log.map(l=>`<div class="li ${l.type}">[${l.t}] ${l.msg}</div>`).join('');
}

// ══════════════════════════════
//  SLEEP
// ══════════════════════════════
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// ══════════════════════════════
//  GOOGLE PLACES
// ══════════════════════════════
// Google Places calls go through a CORS proxy since the REST API
// blocks direct browser requests

// Google Places calls go through a CORS proxy (the REST API
// blocks direct browser requests). We try multiple proxies in case
// one is down or rate-limited.
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function viaProxy(rawUrl) {
  let lastErr = '';
  for (const makeUrl of PROXIES) {
    try {
      const r = await fetch(makeUrl(rawUrl));
      const text = await r.text();
      // Some proxies return a wrapper; try parsing JSON directly
      let data;
      try { data = JSON.parse(text); } catch { data = null; }
      if (!data) { lastErr = `proxy returned non-JSON (${r.status}): ${text.slice(0,150)}`; continue; }
      return { ok: r.ok, status: r.status, data, text };
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(`All proxies failed. Last: ${lastErr}`);
}

async function gSearch(term, token) {
  const reg = REGIONS[S.region] || REGIONS.samui;
  const base = 'https://maps.googleapis.com/maps/api/place/nearbysearch/json';
  const raw  = token
    ? `${base}?pagetoken=${token}&key=${S.gKey}`
    : `${base}?location=${reg.lat},${reg.lng}&radius=${reg.radius}&keyword=${encodeURIComponent(term)}&key=${S.gKey}`;
  const { data } = await viaProxy(raw);
  if (data.error_message) throw new Error(`Google says: ${data.error_message}`);
  if (data.status && !['OK','ZERO_RESULTS'].includes(data.status))
    throw new Error(`Google status: ${data.status}`);
  return data;
}

async function gDetails(pid) {
  const fields = 'name,formatted_address,international_phone_number,website,rating,user_ratings_total,reviews,photos,opening_hours,editorial_summary,url';
  const raw = `https://maps.googleapis.com/maps/api/place/details/json?place_id=${pid}&fields=${fields}&key=${S.gKey}`;
  const { data } = await viaProxy(raw);
  if (data.error_message) throw new Error(`Google says: ${data.error_message}`);
  return data.result || {};
}

// ══════════════════════════════
//  CLAUDE API
// ══════════════════════════════
async function claude(prompt, maxT=8000) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'x-api-key': S.aKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
      'content-type':'application/json'
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens: maxT,
      messages:[{role:'user',content:prompt}]
    })
  });
  if (!r.ok) {
    const errText = await r.text();
    let errMsg = errText.slice(0,200);
    try { const j = JSON.parse(errText); errMsg = j.error?.message || errMsg; } catch{}
    throw new Error(`Claude ${r.status}: ${errMsg}`);
  }
  return (await r.json()).content[0].text;
}

// ══════════════════════════════
//  GITHUB PAGES DEPLOY
//  1. Create repo (new) or reuse (update)
//  2. PUT index.html via Contents API (base64)
//  3. Enable Pages on first deploy
//  URL: https://{user}.github.io/{repo}/  (live in ~2 min)
// ══════════════════════════════

// Proper UTF-8 → base64 (handles Thai/emoji/special chars that btoa() chokes on)
function htmlToB64(html) {
  const bytes = new TextEncoder().encode(html);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToHtml(b64) {
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghSlug(name) {
  return 'cafe-' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
}

async function deploy(html, existingRepo = null, cafeName = 'cafe') {
  if (!S.ghToken) throw new Error('Add GitHub token in Setup first');
  if (!S.ghUser)  throw new Error('Add GitHub username in Setup first');
  if (!html || html === '__saved__') throw new Error('No HTML to deploy');
  if (html.length < 1000) throw new Error(`HTML too short (${html.length} chars)`);

  const headers = {
    'Authorization': `Bearer ${S.ghToken}`,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
    'X-GitHub-Api-Version': '2022-11-28',
  };

  let repoName = existingRepo;

  // ── Step 1: Create repo if new ───────────────────────────────────
  if (!repoName) {
    repoName = ghSlug(cafeName);
    lg(`   📁 Creating repo: ${repoName}`, 'hi');
    const rc = await fetch('https://api.github.com/user/repos', {
      method: 'POST', headers,
      body: JSON.stringify({
        name: repoName,
        description: `Demo website for ${cafeName} — built by Gleb`,
        private: false,  // must be public for free GitHub Pages
        auto_init: true, // creates initial commit so we can push immediately
      }),
    });
    if (!rc.ok) {
      // Read body ONCE only — calling both .json() and .text() causes "body locked" error
      const errBody = await rc.text();
      const errJson = (() => { try { return JSON.parse(errBody); } catch { return {}; } })();
      // Name collision → add short random suffix and retry
      if (errJson.errors?.[0]?.message?.includes('already exists') || rc.status === 422) {
        repoName = repoName + '-' + Math.random().toString(36).slice(2,6);
        lg(`   📁 Name taken — retrying as: ${repoName}`, 'hi');
        const rc2 = await fetch('https://api.github.com/user/repos', {
          method: 'POST', headers,
          body: JSON.stringify({ name: repoName, private: false, auto_init: true }),
        });
        if (!rc2.ok) { const e2 = await rc2.text(); throw new Error(`GitHub repo ${rc2.status}: ${e2.slice(0,200)}`); }
      } else {
        throw new Error(`GitHub repo create ${rc.status}: ${errBody.slice(0,200)}`);
      }
    }
    await sleep(2500); // let GitHub initialise the repo
  }

  // ── Step 2: Get existing file SHA (required for updates) ─────────
  let fileSha = null;
  try {
    const rg = await fetch(
      `https://api.github.com/repos/${S.ghUser}/${repoName}/contents/index.html`,
      { headers }
    );
    if (rg.ok) { const d = await rg.json(); fileSha = d.sha; }
  } catch(e) {}

  // ── Step 3: Push index.html ──────────────────────────────────────
  const kb = Math.round(html.length / 1024);
  lg(`   ⬆️  Pushing ${kb}KB to ${S.ghUser}/${repoName}...`, 'hi');
  const body = { message: fileSha ? 'Update website' : 'Initial deploy', content: htmlToB64(html), branch: 'main' };
  if (fileSha) body.sha = fileSha;

  const rf = await fetch(
    `https://api.github.com/repos/${S.ghUser}/${repoName}/contents/index.html`,
    { method: 'PUT', headers, body: JSON.stringify(body) }
  );
  if (!rf.ok) throw new Error(`GitHub push ${rf.status}: ${(await rf.text()).slice(0,200)}`);

  // ── Step 4: Enable Pages (only needed on first deploy) ───────────
  if (!fileSha) {
    await sleep(1500);
    const rp = await fetch(`https://api.github.com/repos/${S.ghUser}/${repoName}/pages`, {
      method: 'POST', headers,
      body: JSON.stringify({ source: { branch: 'main', path: '/' } }),
    });
    // 201=created, 409=already enabled — both fine
    if (!rp.ok && ![201,409,422].includes(rp.status)) {
      lg(`   ⚠️ Pages enable ${rp.status} — may need to enable manually in GitHub repo settings`, 'err');
    } else {
      lg(`   ✅ GitHub Pages enabled — live in ~2 minutes`, 'ok');
    }
  }

  const siteUrl = `https://${S.ghUser}.github.io/${repoName}/`;
  return { url: siteUrl, siteId: repoName };
}

// Fetches current HTML from GitHub API (more reliable than live URL)
async function getCurrentHtml(lead, which='demo') {
  const cached = which === 'full' ? lead.fullHtml : lead.demoHtml;
  if (cached && cached !== '__saved__' && cached.length > 1000) return cached;

  const repoName = which === 'full' ? lead.fullSiteId : lead.demoSiteId;

  // Try GitHub API first (no CORS issues, always current)
  if (repoName && S.ghToken && S.ghUser) {
    try {
      const r = await fetch(
        `https://api.github.com/repos/${S.ghUser}/${repoName}/contents/index.html`,
        { headers: { 'Authorization': `Bearer ${S.ghToken}`, 'Accept': 'application/vnd.github+json' } }
      );
      if (r.ok) {
        const d = await r.json();
        return b64ToHtml(d.content);
      }
    } catch(e) {}
  }

  // Fallback: fetch from live GitHub Pages URL
  const url = which === 'full' ? lead.fullUrl : lead.demoUrl;
  if (!url) throw new Error('No URL to fetch HTML from');
  try {
    const r = await fetch(url);
    if (r.ok) return await r.text();
  } catch(e) {}
  for (const makeUrl of PROXIES) {
    try { const r = await fetch(makeUrl(url)); if (r.ok) return await r.text(); } catch(e) {}
  }
  throw new Error('Could not fetch current HTML');
}

// ══════════════════════════════
//  BUILD PROMPTS

async function doScrape() {
  if (!S.gKey) { alert('Add your Google API key in Setup first.'); return; }
  S.busy = 'scraping';
  const regionName = REGIONS[S.region]?.name || S.region;
  // Build a set of place_ids we already have, so we never duplicate
  const existing = new Set(S.leads.map(l => l.id));
  const startCount = S.leads.length;
  render();

  const seen = new Set();
  lg(`🔍 Searching ${regionName}... (will skip ${existing.size} cafés you already have)`, 'hi');

  for (const term of TERMS) {
    lg(`Searching "${term}" in ${regionName}...`, 'hi');
    try {
      let token = null;
      for (let p=0; p<2; p++) {
        const data = await gSearch(term, token).catch(e=>{ lg('⚠️ '+e.message,'err'); return {results:[]}; });
        for (const pl of data.results||[]) {
          if (seen.has(pl.place_id)) continue;
          seen.add(pl.place_id);
          if (existing.has(pl.place_id)) {
            lg(`  ⏭ ${pl.name} — already in your list`, 'hi');
            continue;
          }
          try {
            const d = await gDetails(pl.place_id);
            const name = d.name || pl.name || '?';
            if (d.website)                         { lg(`  ⏭ ${name} — has website`,'hi'); continue; }
            if (!d.international_phone_number)      { lg(`  ⏭ ${name} — no phone`,'hi');   continue; }
            if (d.rating && d.rating < 3.5)        { lg(`  ⏭ ${name} — low rating`,'hi'); continue; }
            const lead = {
              id:          pl.place_id,
              name:        name,
              region:      S.region,
              regionName:  regionName,
              address:     d.formatted_address||'',
              phone:       d.international_phone_number||'',
              rating:      d.rating||0,
              reviewCount: d.user_ratings_total||0,
              mapsUrl:     d.url||'',
              summary:     d.editorial_summary?.overview||'',
              hours:       d.opening_hours?.weekday_text||[],
              reviews:     (d.reviews||[]).slice(0,5).map(r=>({text:r.text||'',rating:r.rating,author:r.author_name})),
              photoRefs:   (d.photos||[]).slice(0,3).map(p=>p.photo_reference),
              status:'new', demoHtml:null, demoUrl:null, pitch:null, fullUrl:null
            };
            S.leads.push(lead);
            existing.add(pl.place_id); // also exclude from rest of this run
            lg(`  ✅ ${name} | ⭐${d.rating} | ${d.international_phone_number}`,'ok');
            render();
            await sleep(120);
          } catch(e) { lg('  ❌ '+e.message,'err'); }
        }
        token = data.next_page_token;
        if (!token) break;
        await sleep(2100);
      }
    } catch(e) { lg('Search err: '+e.message,'err'); }
  }

  S.busy = null;
  const found = S.leads.length - startCount;
  lg(`✅ Done! ${found} new leads added from ${regionName}. Total: ${S.leads.length}.`,'ok');
  render();
}

async function doGenerate(id) {
  const lead = S.leads.find(l=>l.id===id);
  if (!lead) return;
  S.busy = id;
  lead.status = 'building';
  render();

  try {
    // ── Step 1: HTML ─────────────────────────────────────────
    // Skip Claude if we already have cached HTML (e.g. previous deploy failed)
    const cachedHtml = lead.demoHtml && lead.demoHtml !== '__saved__' && lead.demoHtml.length > 500;
    let html;
    if (cachedHtml) {
      html = lead.demoHtml;
      lg(`♻️ ${lead.name} — reusing cached HTML (no Claude call)`, 'ok');
    } else {
      lg(`🏗 Generating site for ${lead.name}...`, 'hi');
      html = await claude(sitePrompt(lead), 16000);
      html = html.replace(/^```html\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
      lead.demoHtml = html;
      render(); // persist HTML immediately so a deploy failure won't lose it
    }

    // ── Step 2: Deploy ───────────────────────────────────────
    lg(`🚀 Deploying to GitHub Pages...`, 'hi');
    const result = await deploy(html, lead.demoSiteId || null, lead.name);
    lead.demoUrl    = result.url;
    lead.demoSiteId = result.siteId;
    render(); // persist URL immediately

    // ── Step 3: Pitch ────────────────────────────────────────
    // Skip if we already have one
    if (lead.pitch && lead.pitch.length > 30) {
      lg(`♻️ Reusing existing pitch`, 'ok');
    } else {
      lg(`✍️ Writing WhatsApp pitch...`, 'hi');
      lead.pitch = await claude(pitchPrompt(lead, lead.demoUrl), 350);
    }

    lead.status = 'live';
    lg(`✅ ${lead.name} — live: ${lead.demoUrl}`, 'ok');

  } catch(e) {
    // Keep status 'new' so user can retry.
    // Crucially: demoHtml is already saved above if Claude succeeded,
    // so the next retry will skip Claude and go straight to deploy.
    lead.status = 'new';
    lg(`❌ ${lead.name}: ${e.message}`, 'err');
  }
  S.busy = null;
  render();
}

async function doGenerateAll() {
  const pending = S.leads.filter(l=>l.status==='new');
  for (const l of pending) await doGenerate(l.id);
}

async function doRevise(leadId) {
  const lead = S.leads.find(l=>l.id===leadId);
  if (!lead) return;
  // If the lead has a full deployed version, revise that. Otherwise the demo.
  const which = (lead.fullUrl && ['full','paid'].includes(lead.status)) ? 'full' : 'demo';

  const ta = document.getElementById(`rev-text-${leadId}`);
  const req = ta?.value?.trim();
  if (!req) { alert('Tell me what to change first.'); return; }

  S.busy = leadId;
  render();

  try {
    lg(`📥 Fetching current ${which} site for ${lead.name}...`,'hi');
    const currentHtml = await getCurrentHtml(lead, which);

    lg(`✍️ Asking Claude to apply the changes...`,'hi');
    const prompt = `Here is the current HTML for a café website:

${currentHtml}

The owner wants the following changes:
${req}

Apply ONLY these changes and return the COMPLETE updated HTML file.
Strict rules:
- Preserve all other content, structure, styling, and functionality EXACTLY as is
- Do not rewrite or restructure — only modify what's requested
- ${which === 'demo' ? 'KEEP the watermark elements (#wmt and #wmb) intact and visible' : 'Do NOT add any watermark — this is the paid production version'}
- Return ONLY the complete HTML starting with <!DOCTYPE html>
- No explanation, no markdown fences, no preamble`;

    let newHtml = await claude(prompt, 16000);
    newHtml = newHtml.replace(/^```html\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();

    const siteId = which === 'full' ? lead.fullSiteId : lead.demoSiteId;
    if (!siteId) throw new Error('Missing GitHub repo name — try regenerating the site');

    lg(`🚀 Redeploying to same URL...`,'hi');
    const result = await deploy(newHtml, siteId, lead.name);

    if (which === 'full') {
      lead.fullHtml   = newHtml;
      lead.fullUrl    = result.url || lead.fullUrl;
    } else {
      lead.demoHtml   = newHtml;
      lead.demoUrl    = result.url || lead.demoUrl;
    }
    lead.revisions = (lead.revisions || 0) + 1;

    S.revisingId = null;
    lg(`✅ Revision #${lead.revisions} live: ${which === 'full' ? lead.fullUrl : lead.demoUrl}`,'ok');
  } catch(e) {
    lg(`❌ Revision failed: ${e.message}`,'err');
  }

  S.busy = null;
  render();
}

async function doFull(id) {
  const lead = S.leads.find(l=>l.id===id);
  if (!lead?.demoUrl) return;  // need at least a deployed demo
  S.busy = id;
  lead.status = 'building';
  render();
  try {
    lg(`🧹 Removing watermark for ${lead.name}...`,'hi');
    let html = lead.demoHtml;
    if (!html || html === '__saved__') {
      lg(`📥 Fetching live demo HTML...`,'hi');
      html = await getCurrentHtml(lead, 'demo');
    }
    html = html.replace(/<style>\s*#wmt[\s\S]*?body\{padding-bottom:54px!important\}\s*<\/style>/g,'');
    html = html.replace(/<div id="wmt"><\/div>/g,'');
    html = html.replace(/<div id="wmb">[\s\S]*?<\/div>/g,'');
    lead.fullHtml = html;
    lg(`🚀 Deploying full version...`,'hi');
    const result = await deploy(html, lead.fullSiteId || null, lead.name);
    lead.fullUrl    = result.url;
    lead.fullSiteId = result.siteId;
    lead.status     = 'full';
    lg(`✅ Full site live: ${lead.fullUrl}`,'ok');
  } catch(e) {
    lead.status = 'interested';
    lg(`❌ ${e.message}`,'err');
  }
  S.busy = null;
  render();
}

function exportData() {
  const slim = S.leads.map(l => ({
    ...l,
    demoHtml: l.demoHtml && l.demoHtml !== '__saved__' ? l.demoHtml : (l.demoHtml ? '__saved__' : null),
    fullHtml: l.fullHtml ? '__saved__' : null,
  }));
  const payload = JSON.stringify({
    gKey: S.gKey, aKey: S.aKey,
    ghToken: S.ghToken, ghUser: S.ghUser,
    wiseLink: S.wiseLink, usdtAddr: S.usdtAddr,
    region: S.region, leads: slim,
    exported: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([payload], {type: 'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'cafe-pipeline-backup.json'; a.click();
  URL.revokeObjectURL(url);
  lg('📦 Data exported', 'ok');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!confirm(`Import ${(d.leads||[]).length} leads from backup? This replaces current data.`)) return;
        S.gKey     = d.gKey     || S.gKey;
        S.aKey     = d.aKey     || S.aKey;
        S.ghToken = d.ghToken || S.ghToken;
        S.ghUser  = d.ghUser  || S.ghUser;
        S.wiseLink = d.wiseLink || S.wiseLink;
        S.usdtAddr = d.usdtAddr || S.usdtAddr;
        S.region   = d.region   || S.region;
        S.leads    = d.leads    || [];
        saveState();
        render();
        lg(`✅ Imported ${S.leads.length} leads from backup`, 'ok');
      } catch(err) { alert('Invalid backup file: ' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

<div class="stats">
  <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Total leads</div></div>
  <div class="stat"><div class="stat-n">${live}</div><div class="stat-l">Demos live</div></div>
  <div class="stat"><div class="stat-n">${paid}</div><div class="stat-l">Paid 💰</div></div>
</div>

${breakdownHtml ? `<div class="card" style="padding:11px 12px"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">By region</div>${breakdownHtml}</div>` : ''}

<div class="card">
  <div class="field">
    <label>🌏 Region to search</label>
    <select id="rg-sel" onchange="S.region=this.value;render()" style="width:100%;padding:9px 11px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
      ${regionOpts}
    </select>
  </div>
  <button class="btn btn-a btn-block" onclick="doScrape()" ${going?'disabled':''}>
    ${going?'<span class="spin"></span> Searching '+regName+'...':`🔍 Find Cafés in ${regName}`}
  </button>
</div>

${total>0?`<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="go('build')">🏗 Go to Build Tab (${total} leads) →</button>`:''}

<div class="log" id="log"></div>`;
}

// ── Build Tab ──
function rBuild() {
  const newOnes = S.leads.filter(l=>l.status==='new');
  const done    = S.leads.filter(l=>!['new','building'].includes(l.status)).length;
  const total   = S.leads.length;

  if (!total) return `<div class="ttl" style="margin-top:4px">🏗 Build</div><div class="sub">No leads yet.</div>
    <div class="empty"><div class="empty-i">🔍</div><p>Find cafés first.</p>
    <button class="btn btn-a" onclick="go('find')" style="margin-top:10px">Go to Find →</button></div>`;

  const pct = total ? Math.round(done/total*100) : 0;
  return `
<div class="sec-row">
  <div><div class="ttl" style="margin-top:4px">🏗 Build Demos</div>
  <div class="sub">${done}/${total} done</div></div>
  ${newOnes.length>1?`<button class="btn btn-a btn-sm" onclick="doGenerateAll()" ${S.busy?'disabled':''}>${S.busy?'<span class="spin"></span>':'⚡ Build All'}</button>`:''}
</div>
<div class="prog"><div class="prog-f" style="width:${pct}%"></div></div>

${S.leads.map(rLeadCard).join('')}

<div class="log" id="log" style="margin-top:4px"></div>`;
}

function rLeadCard(lead) {
  const [bc, bl] = BADGES[lead.status] || ['s-new','?'];
  const busy = S.busy===lead.id;
  const reviseOpen = S.revisingId === lead.id;
  const canRevise = ['live','sent','interested','full','paid'].includes(lead.status);
  const revWhich = (lead.fullUrl && ['full','paid'].includes(lead.status)) ? 'full version' : 'demo';
  const revCount = lead.revisions || 0;
  return `
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
    <div style="flex:1;min-width:0">
      <div class="card-name">${lead.name}${revCount?`<span class="rev-count">${revCount} rev</span>`:''}</div>
      <div class="card-meta">⭐${lead.rating} · ${lead.reviewCount} reviews<br>
        <a href="https://wa.me/${lead.phone.replace(/[^0-9]/g,'')}" target="_blank" style="color:var(--green)">📱 ${lead.phone}</a>
      </div>
    </div>
    <span class="badge ${bc}">${bl}</span>
  </div>

  ${lead.demoUrl?`<div style="margin:6px 0 4px"><a href="${lead.demoUrl}" target="_blank" class="lnk">🔗 ${lead.demoUrl}</a></div>`:''}
  ${lead.fullUrl?`<div style="margin:6px 0 4px"><a href="${lead.fullUrl}" target="_blank" class="lnk lnk-g">🌐 ${lead.fullUrl}</a></div>`:''}

  ${lead.pitch?`
  <textarea class="pitch-area" id="pt-${lead.id}" readonly>${lead.pitch}</textarea>
  <button class="btn btn-ghost btn-sm" id="cp-${lead.id}" onclick="copy(document.getElementById('pt-${lead.id}').value,'cp-${lead.id}')">📋 Copy Pitch</button>
  `:''}

  <div class="acts">
    ${lead.status==='new'?`<button class="btn btn-a btn-sm" onclick="doGenerate('${lead.id}')" ${busy||S.busy?'disabled':''}>${busy?'<span class="spin"></span> Building...':'🏗 Build Demo'}</button>`:''}
    ${lead.status==='new' && lead.demoUrl?`<button class="btn btn-ghost btn-sm" onclick="clearAndRebuild('${lead.id}')" ${busy||S.busy?'disabled':''} title="Site deployed but blank? Clear cache and regenerate from scratch">🔄 Force Rebuild</button>`:''}
    ${lead.status==='live'?`<button class="btn btn-g btn-sm" onclick="mark('${lead.id}','sent')">📤 Mark as Sent</button>`:''}
    ${lead.status==='sent'?`
      <button class="btn btn-a btn-sm" onclick="mark('${lead.id}','interested')">🔥 They Replied!</button>
      <button class="btn btn-ghost btn-sm" onclick="mark('${lead.id}','declined')">❌ Declined</button>`:''}
    ${lead.status==='interested'?`<button class="btn btn-g btn-sm" onclick="doFull('${lead.id}')" ${busy?'disabled':''}>${busy?'<span class="spin"></span>':'🚀 Build Full Version'}</button>`:''}
    ${lead.status==='full'?`
      <button class="btn btn-a btn-sm" id="pm-${lead.id}" onclick="copy(payMsg(S.leads.find(l=>l.id==='${lead.id}')), 'pm-${lead.id}')">💳 Copy Payment Msg</button>
      <button class="btn btn-g btn-sm" onclick="mark('${lead.id}','paid')">✅ Mark Paid</button>`:''}
    ${canRevise && !reviseOpen ? `<button class="btn btn-ghost btn-sm" onclick="S.revisingId='${lead.id}';render();setTimeout(()=>document.getElementById('rev-text-${lead.id}')?.focus(),50)">🛠 Revise ${revWhich}</button>` : ''}
  </div>

  ${reviseOpen ? `
  <div class="revise-box">
    <div class="rev-hint">Revising the <b>${revWhich}</b>. Same URL, refreshes after deploy.</div>
    <textarea id="rev-text-${lead.id}" placeholder="What should change?

e.g.
• Change green to terracotta
• Make hero text smaller
• Add a Gift Cards section after Menu
• Move Reviews above About
• Use a more elegant serif font"></textarea>
    <div class="acts">
      <button class="btn btn-a btn-sm" onclick="doRevise('${lead.id}')" ${busy?'disabled':''}>${busy?'<span class="spin"></span> Applying...':'✨ Apply Revision'}</button>
      <button class="btn btn-ghost btn-sm" onclick="S.revisingId=null;render()" ${busy?'disabled':''}>Cancel</button>
    </div>
  </div>` : ''}
</div>`;
}

// ── CRM Tab ──
function rCRM() {
  if (!S.leads.length) return `<div class="ttl" style="margin-top:4px">📱 CRM</div>
    <div class="empty"><div class="empty-i">📭</div><p>No leads yet.</p>
    <button class="btn btn-a" onclick="go('find')" style="margin-top:10px">Find Cafés →</button></div>`;

  const groups = [
    ['🔥 Interested — waiting for full site', 'interested'],
    ['✅ Full Site Ready — send payment',      'full'],
    ['💰 Paid',                                'paid'],
    ['📤 Pitch Sent',                          'sent'],
    ['🌐 Demo Live',                           'live'],
    ['❌ Declined',                            'declined'],
  ];

  let out = `<div class="ttl" style="margin-top:4px">📱 CRM</div><div class="sub">Track your deals.</div>`;
  let any = false;

  for (const [label, st] of groups) {
    const ls = S.leads.filter(l=>l.status===st);
    if (!ls.length) continue;
    any = true;
    out += `<div class="grp">${label}</div>`;
    out += ls.map(lead => {
      const [bc,bl] = BADGES[lead.status]||['s-new','?'];
      const reviseOpen = S.revisingId === lead.id;
      const canRevise = ['interested','full','paid'].includes(lead.status);
      const revWhich = (lead.fullUrl && ['full','paid'].includes(lead.status)) ? 'full version' : 'demo';
      const revCount = lead.revisions || 0;
      const busy = S.busy === lead.id;
      return `
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
    <div><div class="card-name">${lead.name}${revCount?`<span class="rev-count">${revCount} rev</span>`:''}</div>
    <div class="card-meta"><a href="https://wa.me/${lead.phone.replace(/[^0-9]/g,'')}" target="_blank" style="color:var(--green)">📱 ${lead.phone}</a></div></div>
    <span class="badge ${bc}">${bl}</span>
  </div>
  ${lead.fullUrl?`<div style="margin:5px 0"><a href="${lead.fullUrl}" target="_blank" class="lnk lnk-g">🌐 ${lead.fullUrl}</a></div>`:''}
  ${lead.demoUrl&&!lead.fullUrl?`<div style="margin:5px 0"><a href="${lead.demoUrl}" target="_blank" class="lnk">🔗 ${lead.demoUrl}</a></div>`:''}
  ${lead.status==='full'?`
  <div class="alert alert-ok" style="margin-top:8px;font-size:11px;line-height:1.6">
    Send them:<br>
    🌐 <b>${lead.fullUrl}</b><br>
    ${S.usdtAddr ? `💎 USDT: <b>${S.usdtAddr.slice(0,10)}...</b><br>` : ''}
    ${S.wiseLink ? `💼 Wise: <b>${S.wiseLink}</b>` : ''}
    ${!S.usdtAddr && !S.wiseLink ? '⚠️ Add payment in Setup' : ''}
  </div>
  <div class="acts"><button class="btn btn-a btn-sm" id="pm2-${lead.id}" onclick="copy(payMsg(S.leads.find(l=>l.id==='${lead.id}')),'pm2-${lead.id}')">📋 Copy Message</button>
  <button class="btn btn-g btn-sm" onclick="mark('${lead.id}','paid')">✅ Mark Paid</button></div>`:''}
  ${canRevise && !reviseOpen ? `<div class="acts" style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="S.revisingId='${lead.id}';render();setTimeout(()=>document.getElementById('rev-text-${lead.id}')?.focus(),50)">🛠 Revise ${revWhich}</button></div>` : ''}
  ${reviseOpen ? `
  <div class="revise-box">
    <div class="rev-hint">Revising the <b>${revWhich}</b>. Same URL — customer just refreshes.</div>
    <textarea id="rev-text-${lead.id}" placeholder="What should change?

e.g.
• Update phone number to +66 xx xxx xxxx
• Add a Gift Cards section
• Change colors to dark green and gold
• Add Thai language version"></textarea>
    <div class="acts">
      <button class="btn btn-a btn-sm" onclick="doRevise('${lead.id}')" ${busy?'disabled':''}>${busy?'<span class="spin"></span> Applying...':'✨ Apply Revision'}</button>
      <button class="btn btn-ghost btn-sm" onclick="S.revisingId=null;render()" ${busy?'disabled':''}>Cancel</button>
    </div>
  </div>` : ''}
</div>`;
    }).join('');
  }

  if (!any) out += `<div class="empty"><div class="empty-i">⏳</div><p>No activity yet — build demos and start sending pitches!</p></div>`;
  return out;
}

// ══════════════════════════════
//  BOOT
// ══════════════════════════════
loadState();
render();
</script>
</body>
</html>
